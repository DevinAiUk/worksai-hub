name: WorksAI CI/CD — worksai-hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Brand/Secret Gate, TypeScript Check & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run TypeScript & ESM Syntax Verification
        run: npm run typecheck

      - name: Validate SQL Migrations Exist & Are Non-Empty
        run: test -s migrations/0001_worksai_hub.sql && test -s migrations/0002_seed_worksai_hub.sql

      - name: Run Automated Unit, Negative Security & Durable R2 Revocation Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Bundle & Edge Smoke Check (worksai.org)
        run: |
          node --input-type=module -e 'import { handleWorksAiRequest } from "./dist/worker.mjs"; const r = await handleWorksAiRequest(new Request("https://worksai.org/api/health")); const j = await r.json(); if (!j.ok || j.appsCount !== 12 || j.articlesCount !== 20) process.exit(1); console.log("Verified bundle health:", j.service);'
          curl -sS -A "Mozilla/5.0 (compatible; WorksAI-CI/1.0)" https://worksai.org/api/health | head -c 300 || true
