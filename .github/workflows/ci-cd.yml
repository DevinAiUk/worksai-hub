name: WorksAI CI/CD — worksai-hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Brand/Secret Gate, TypeScript Check & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run TypeScript & ESM Syntax Verification
        run: npm run typecheck

      - name: Validate SQL Migrations Exist & Are Non-Empty
        run: test -s migrations/0001_worksai_hub.sql && test -s migrations/0002_seed_worksai_hub.sql

      - name: Run Automated Unit, Negative Security & Durable R2 Revocation Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Post-Deploy Live HTTPS Smoke Check (worksai.org & preview.worksai.org)
        run: |
          curl --fail --silent --show-error https://worksai.org/api/health | grep '"ok":true'
          curl --fail --silent --show-error https://preview.worksai.org/api/health | grep '"ok":true'
